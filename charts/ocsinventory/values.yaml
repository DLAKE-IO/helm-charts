# Values for ocs-inventory.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## Global configuration for using existing secrets
## If existingSecret is specified, the chart will use the existing secret instead of creating new ones
## The secret should contain the following keys:
## - external-db-password: Password for external database
## - db-password: Password for database user
## - db-root-password: Root password for database
## - mariadb-password: Password for MariaDB
## - ingress-basicauth-password: Password for ingress basic auth
#
existingSecret: ""

## Official OCS Inventory image version
## https://hub.docker.com/r/ocsinventory/ocsinventory-docker-image
#
image:
  repository: ocsinventory/ocsinventory-docker-image
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to chart appVersion when empty.
  tag: ""

imagePullSecrets: []

# Number of replicas to be deployed
replicaCount: 1

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
deploymentAnnotations: {}
Labels: {}
podSecurityContext: {}
securityContext: {}

## PHP configuration
## https://www.php.net/manual/ini.core.php
#
phpconfig:
  ocsinventory: |
    upload_max_filesize = 200M
    post_max_size = 201M
    max_execution_time = -1
    max_input_time = -1

## Enable persistence using Persistent Volume Claims
## https://kubernetes.io/docs/concepts/storage/persistent-volumes/
#
persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  # Set storage class here
  storageClass: ""
  ##  Use an existing PVC
  # existingClaim: ""
  annotations: {}

## External database configuration
#
externalDatabase:
  enabled: true
  hostname: ""
  username: ""
  password: ""  # Ignored if existingSecret is set
  database: ""

## Configuration for creating a database on an existing server
database:
  create: false
  jobName: "createdb"
  hostname: ""
  username: ""
  password: ""  # Ignored if existingSecret is set
  database: ""
  root_password: ""  # Ignored if existingSecret is set

## MariaDB chart configuration
## create mariadb server and database for OCS
#
mariadb:
  enabled: false
  jobName: "createmariadbserver"
  auth:
    rootPassword: ""
    database: ""
    username: ""
    password: ""

## Allowing use of ingress controllers
## https://kubernetes.io/docs/concepts/services-networking/ingress/
#
ingress:
  enabled: true
  className: ""
  labels: {}
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: 200M
    # nginx.ingress.kubernetes.io/proxy-connect-timeout: 300s
    # nginx.ingress.kubernetes.io/proxy-send-timeout: 300s
    # nginx.ingress.kubernetes.io/proxy-read-timeout: 300s
    # cert-manager.io/cluster-issuer: ""
    # nginx.ingress.kubernetes.io/app-root: /ocsreports/
    # nginx.ingress.kubernetes.io/whitelist-source-range: ""
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  basicauth:
    enabled: false
    username: ""
    password: ""  # Ignored if existingSecret is set
    authRealm: "Authentication Required"
    paths:
      - "/ocsapi"
      - "/ocsinventory"

## Gateway API HTTPRoute (alternative to ingress). Requires the Gateway API
## CRDs and a pre-existing Gateway owned by the cluster admin. TLS is terminated
## at the Gateway listener, not here. ingress and httpRoute toggle independently;
## ingress.enabled defaults to true, set it to false for Gateway-only exposure.
## ingress.basicauth is NOT applied to the HTTPRoute.
httpRoute:
  enabled: false
  ## The existing Gateway(s) this route attaches to.
  parentRefs:
    - name: ""            # REQUIRED when enabled: the Gateway's name
      # namespace: ""     # omit if the Gateway is in the release namespace
      # sectionName: ""   # the listener to bind, e.g. "https"
      #                   # REQUIRED when httpsRedirect is enabled (the HTTPS listener)
  ## Hostnames this route answers for (route-level, not per-path).
  hostnames: []
    # - ocs.example.com
  ## Path matches; the backendRef to the app service (port 80) is implicit.
  paths:
    - type: PathPrefix
      value: /
  ## Extra annotations on the HTTPRoute object.
  annotations: {}
  ## HTTP -> HTTPS redirect: a secondary HTTPRoute on the HTTP (:80) listener
  ## carrying a RequestRedirect filter. On by default; only acts when
  ## httpRoute.enabled AND an HTTP listener is identified below. When enabled,
  ## the app route above MUST pin its HTTPS listener via parentRefs[].sectionName
  ## (an unpinned route binds all listeners incl. :80 and would loop).
  httpsRedirect:
    enabled: true
    sectionName: ""             # the HTTP (:80) listener on the same Gateway
    statusCode: 301
    # parentRefs: []            # optional: override to a different Gateway/listener

## Ressources limits and requests for the container
## https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
#
resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

metrics:
  enabled: false
  image:
    repository: "docker.io/bitnami/apache-exporter"
    tag: "1.0.9-debian-12-r5"
    pullPolicy: IfNotPresent
  serviceMonitor:
    enabled: false
    labels:
      prometheus: prometheus
      release: tobedefined
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 100Mi
