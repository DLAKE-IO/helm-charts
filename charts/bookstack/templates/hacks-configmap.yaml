{{- if include "bookstack.hacks.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookstack.fullname" . }}-hacks
  labels:
    {{- include "bookstack.labels" . | nindent 4 }}
data:
  {{- range $name, $hack := .Values.hacks }}
  {{- if dig "enabled" true $hack }}
  {{- if hasKey $hack.files "bookstack-module.json" }}
  {{- fail (printf "hacks.%s.files: bookstack-module.json is generated by the chart; remove it (use hacks.%s.description for the module description)" $name $name) }}
  {{- end }}
  {{- $module := dict "name" $name "description" ($hack.description | default "") "version" (printf "1.0.0-%s" (toJson $hack.files | sha256sum | trunc 12)) }}
  {{ include "bookstack.hacks.fileKey" (list $name "bookstack-module.json") | quote }}: {{ toJson $module | quote }}
  {{- range $path, $content := $hack.files }}
  {{ include "bookstack.hacks.fileKey" (list $name $path) | quote }}: {{ $content | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
