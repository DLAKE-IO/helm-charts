{{- if and .Values.dashboard.enabled .Values.dashboard.httpRoute.enabled -}}
{{- range $i, $ref := .Values.dashboard.httpRoute.parentRefs }}
{{- if not $ref.name }}{{ fail (printf "dashboard.httpRoute.parentRefs[%d].name is required when dashboard.httpRoute.enabled=true" $i) }}{{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-dashboard
  {{- with .Values.dashboard.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.dashboard.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.dashboard.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- range .Values.dashboard.httpRoute.paths }}
        - path:
            type: {{ .type }}
            value: {{ .value }}
        {{- end }}
      backendRefs:
        - name: {{ include "wazuh.fullname" . }}-dashboard
          port: {{ .Values.dashboard.service.httpPort }}
{{- end }}
