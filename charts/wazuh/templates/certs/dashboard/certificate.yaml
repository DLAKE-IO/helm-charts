{{- if  and .Values.certificates.enabled .Values.dashboard.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  # Secret names are always required.
  secretName: dashboard-tls
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  duration: {{ .Values.certificates.duration }}
  renewBefore: {{ .Values.certificates.renewBefore }}
  isCA: false
  commonName: {{ include "wazuh.fullname" . }}-dashboard
  {{- if include "wazuh.dashboard.backendTLSPolicy.enabled" . }}
  {{- $svc := printf "%s-dashboard" (include "wazuh.fullname" .) }}
  dnsNames:
    {{- toYaml (uniq (list $svc (printf "%s.%s.svc" $svc .Release.Namespace) (include "wazuh.dashboard.backendTLSPolicy.hostname" .))) | nindent 4 }}
  {{- end }}
  subject:
    organizations:
      - {{ .Values.certificates.subject.organization }}
    countries:
      - {{ .Values.certificates.subject.country }}
    localities:
      - {{ .Values.certificates.subject.locality }}
  # Issuer references are always required.
  issuerRef:
    name: {{ .Values.certificates.issuer.name | default (printf "%s-ca-issuer" (include "wazuh.fullname" .)) }}
    {{- if eq .Values.certificates.issuer.type "ClusterIssuer" }}
    kind: ClusterIssuer
    {{- end }}
{{- end }}